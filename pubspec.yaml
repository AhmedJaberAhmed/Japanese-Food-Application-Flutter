name: sushi_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts:
  flutter_bloc: ^8.0.0
  sqflite:
  path:
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/sushi_images/


flutter_icons:
  android: true
  ios: true
  image_path: "lib/sushi_images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "lib/sushi_images/icon.png"
